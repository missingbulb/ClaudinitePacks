name: Fleet baseline

# THE ENFORCER'S MANUAL LEVER over the whole fleet: force every covered member to
# baseline NOW, instead of waiting for each one's next hourly slot. It fires each
# member's OWN scheduler workflow with `overrides: FORCE_TASKS=baselining` — the same
# button the owner would press in that repo's Actions tab, pressed across the fleet in
# one run. Nothing is baselined here: each member converges its own mount, with its own
# token, under its own delivery policy.
#
# IT ALSO WAITS. By default the run does not end at the last dispatch — it FOLLOWS every
# member it forced until that member has finished baselining (its maintenance PR merged,
# or nothing to deliver, or a PR left open for a `review` member), including the nights
# where a member's converge hands off to an agent that runs outside its Actions run, and
# reports what the fleet did: which members moved, from which canon ref to which, lines
# changed, how long each took, errors and warnings, and whether an agent was involved.
# THE LOGIC OF THAT LIVES IN THE MOUNT, not here — this file grows two inputs and passes
# them through, because a workflow file in a consumer repo is the one thing the nightly
# converge cannot push (see the sync note below), so every line put here is a line that
# only reaches the fleet through the slow path.
#
# A MANAGED COPY, LANDED BY HAND. This file is owned by the sheepdog pack
# (packs/sheepdog/stubs/workflows/fleet-baseline.yml); the copy here is byte-identical
# and carries no repo-specific value. It lives in .github/ rather than running from the
# mount because GitHub reads workflows only from a repo's own .github/; the LOGIC it
# runs stays in the mount (.claudinite/shared/packs/sheepdog/fleet-baseline/), so this
# file is copy-verbatim in every enforcer repo and changes only when its inputs change.
#
# IT SYNCS ITSELF, by a route worth knowing: the nightly converge pushes with the
# Action's GITHUB_TOKEN, which GitHub never permits to write under .github/workflows/,
# so the converge WITHHOLDS this file from its own commit and baselining's agent stage
# lands it on the same maintenance branch over MCP — a credential that does hold the
# `workflows` permission (#649). So a hand-edit here is still overwritten, just one
# stage later than the rest of the converge. Fix the pack, not this copy.
#
# NO `schedule:` TRIGGER, DELIBERATELY. The vendored `claudinite-scheduler.yml` is this
# repo's only cron (packs/basics/scheduled-tasks.md), and this workflow does not add a
# second one. It is not recurring work with a cadence — it is an owner-initiated
# operation, started by a human pressing "Run workflow", which is exactly what
# workflow_dispatch is for. Members baseline themselves hourly; this is for the cases
# that should not wait for that.
on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Limit to these repos (comma-separated; bare name or owner/name). Empty = every covered member.'
        required: false
        default: ''
      dry_run:
        description: 'List what would be dispatched without dispatching anything.'
        type: boolean
        required: false
        default: false
      include_dormant:
        description: 'Also force members that declared themselves dormant (they are skipped by default — a dormant repo stopped its own scheduler on purpose).'
        type: boolean
        required: false
        default: false
      follow:
        description: 'Watch every forced member until it has finished baselining (its maintenance PR merged, nothing to deliver, or left open for review) and report what each one did. Off = dispatch and exit, the old fire-and-forget behaviour.'
        type: boolean
        required: false
        default: true
      follow_timeout_minutes:
        description: 'How long to keep following before calling the remaining members unfinished. An agentic night on a slow member is the case this is sized for.'
        required: false
        default: '45'

# One fleet-wide force at a time. Not cancel-in-progress: a run that has already
# dispatched half the fleet has done half its work for real, and killing it would leave
# the fleet in a state no report describes.
concurrency:
  group: fleet-baseline
  cancel-in-progress: false

# Reads this repo's own declaration for the sheepdog config; every write it makes is to
# ANOTHER repo's Actions, over FLEET_GITHUB_TOKEN, which github.token cannot do.
permissions:
  contents: read

jobs:
  force-baseline:
    runs-on: ubuntu-latest
    # A followed run is mostly SLEEP — it waits on a fleet's worth of member runs, their
    # CI, and any agent the converge handed off to. The bound here is the backstop for a
    # follow that never converges, deliberately above `follow_timeout_minutes` (the
    # script's own deadline, which ends the follow with a REPORT); this one only ever
    # fires if the script itself is wedged, and a killed job reports nothing at all.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Force baselining across the fleet
        env:
          # The account-spanning PAT the sheepdog sweeps already use, plus the scopes they
          # do not need:
          #   - Actions READ AND WRITE — dispatching another repo's workflow is an Actions
          #     write; without it every member reports `no-permission` and the run fails.
          #     The READ half is what the follow reads run state and job findings through.
          #   - Pull requests READ and Issues READ — how the follow sees a member's
          #     maintenance PR land and its `ready-for-agent` dispatch issue close, which
          #     is what "finished baselining" is actually measured on.
          FLEET_GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_TOKEN }}
          FLEET_BASELINE_REPOS: ${{ inputs.repos }}
          FLEET_BASELINE_DRY_RUN: ${{ inputs.dry_run }}
          FLEET_BASELINE_INCLUDE_DORMANT: ${{ inputs.include_dormant }}
          FLEET_BASELINE_FOLLOW: ${{ inputs.follow }}
          FLEET_BASELINE_FOLLOW_MINUTES: ${{ inputs.follow_timeout_minutes }}
        run: node .claudinite/shared/packs/sheepdog/fleet-baseline/force-fleet-baseline.mjs
