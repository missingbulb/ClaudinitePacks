name: release-packs

# Publishes every pack version not yet on the `vendored` branch: build vendors the archives with
# no secrets, publish checks them by SHA-256, signs each pack index and the shelf's catalog and
# pushes, and upload makes the R2 bucket behind packs.claudinite.com hold what the branch holds.
# docs/release.md.
on:
  push:
    branches: [main]
    paths: [packs/**, tools/**, .github/workflows/release-packs.yml]
  workflow_dispatch:

concurrency:
  group: release-packs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Release, signing and vendor tests
        run: node --test $(git ls-files 'tools/release/*.test.mjs' 'tools/sign/*.test.mjs' 'tools/vendor/*.test.mjs')
      - name: Build the vendored archives
        run: node tools/release/release.mjs build --out "$RUNNER_TEMP/archives"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives
          path: ${{ runner.temp }}/archives
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archives
          path: ${{ runner.temp }}/archives
      - name: Publish
        env:
          PACKS_KEY: ${{ secrets.CN_PACKS_KEY }}
          PACKS_CERT: ${{ secrets.CN_PACKS_CERT }}
        run: |
          if [ -z "$PACKS_KEY" ] || [ -z "$PACKS_CERT" ]; then
            echo "::error::the release environment must hold both CN_PACKS_KEY and CN_PACKS_CERT"
            exit 1
          fi
          umask 077
          printf '%s\n' "$PACKS_KEY" > "$RUNNER_TEMP/packs.key"
          printf '%s\n' "$PACKS_CERT" > "$RUNNER_TEMP/packs.cert.json"
          signing=(--key "$RUNNER_TEMP/packs.key" --cert "$RUNNER_TEMP/packs.cert.json")
          # The development roots signed vendored before ClaudiniteEngine#5; publish re-signs what they
          # alone vouch for, and nothing else trusts them.
          node tools/release/release.mjs publish --archives "$RUNNER_TEMP/archives" --roots keys/roots --previous-roots keys/retired-dev-roots --summary "$GITHUB_STEP_SUMMARY" "${signing[@]}"

  upload:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Upload to R2 and read back through the CDN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/release/release.mjs upload --r2 claudinite-packs --roots keys/roots --remote origin --summary "$GITHUB_STEP_SUMMARY"
