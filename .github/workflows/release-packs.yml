name: release-packs

# Publishes every pack version not yet on the `vendored` branch: build vendors the archives with
# no secrets, publish checks them by SHA-256, signs each pack index and pushes. docs/release.md.
on:
  push:
    branches: [main]
    paths: [packs/**, tools/**, .github/workflows/release-packs.yml]
  workflow_dispatch:

concurrency:
  group: release-packs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Release, signing and vendor tests
        run: node --test $(git ls-files 'tools/release/*.test.mjs' 'tools/sign/*.test.mjs' 'tools/vendor/*.test.mjs')
      - name: Build the vendored archives
        run: node tools/release/release.mjs build --out "$RUNNER_TEMP/archives"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archives
          path: ${{ runner.temp }}/archives
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: archives
          path: ${{ runner.temp }}/archives
      - name: Publish
        env:
          PACKS_KEY: ${{ secrets.CN_PACKS_KEY }}
          PACKS_CERT: ${{ secrets.CN_PACKS_CERT }}
        run: |
          signing=()
          if [ -n "$PACKS_KEY" ] || [ -n "$PACKS_CERT" ]; then
            if [ -z "$PACKS_KEY" ] || [ -z "$PACKS_CERT" ]; then
              echo "::error::the release environment holds only one of CN_PACKS_KEY and CN_PACKS_CERT"
              exit 1
            fi
            umask 077
            printf '%s\n' "$PACKS_KEY" > "$RUNNER_TEMP/packs.key"
            printf '%s\n' "$PACKS_CERT" > "$RUNNER_TEMP/packs.cert.json"
            signing=(--key "$RUNNER_TEMP/packs.key" --cert "$RUNNER_TEMP/packs.cert.json")
          else
            echo "::warning::signed with the development key"
          fi
          node tools/release/release.mjs publish --archives "$RUNNER_TEMP/archives" --roots keys/dev/roots --summary "$GITHUB_STEP_SUMMARY" "${signing[@]}"
