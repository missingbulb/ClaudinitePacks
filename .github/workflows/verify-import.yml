name: verify-import

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Claudinite's packs/ is frozen at the commit docs/import.md records, and packs/ here now diverges
  # from it on purpose: this job proves the record still reproduces the import and that the branch
  # carries the import history, never that packs/ still equals Claudinite's.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install git-filter-repo==2.47.0
      - name: Tools' tests
        run: node --test $(git ls-files 'tools/*.test.mjs')
      - name: Read the recorded source commit
        id: source
        run: |
          commit=$(sed -n 's/^Source commit: `\([0-9a-f]\{40\}\)`$/\1/p' docs/import.md)
          if [ -z "$commit" ]; then echo "::error::docs/import.md records no Source commit"; exit 1; fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Clone Claudinite anonymously
        run: |
          git clone --no-local https://github.com/missingbulb/Claudinite "$RUNNER_TEMP/import/src"
          git -C "$RUNNER_TEMP/import/src" fetch --depth=6000 origin main
      - name: Import
        run: tools/import/import.sh "${{ steps.source.outputs.commit }}" "$RUNNER_TEMP/import"
      - name: Verify the fresh import
        run: node tools/import/verify.mjs --source "$RUNNER_TEMP/import/src" --commit "${{ steps.source.outputs.commit }}" --import "$RUNNER_TEMP/import/out"
      - name: This branch carries the import history
        run: |
          git fetch -q "$RUNNER_TEMP/import/out" import:refs/ci/import
          git merge-base --is-ancestor refs/ci/import HEAD || { echo "::error::the import tip $(git rev-parse refs/ci/import) is not in this branch's history; merge the import branch as docs/import.md shows"; exit 1; }

  # The pull-request half of "a version is published once": a pack whose shipped content changed
  # under a version already on `vendored` fails here, before the merge; release-packs' publish job
  # refuses the same thing after it. No secrets, so a fork's pull request runs it too.
  release-plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Every changed pack carries a new version
        run: node tools/release/release.mjs plan --content --remote origin
      - name: The pack directory is current with the manifests and the catalog
        run: node tools/directory/render.mjs --check --remote origin

  # Every pack's Go checks and test/ fixtures, against the cn this repository pins.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24"
      - name: Fetch the pinned engine
        run: sh .claudinite/launch version
      - name: The packs' checks and fixtures
        env:
          CLAUDINITE_CN: .claudinite/bin/cn
        run: sh tools/checks/test.sh

  # growth-promote may write only under the shelf's corpus roots. Nothing in a tree marks a diff
  # as a promote run, so the gate keys on the branch the task delivers on.
  promote-scope:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'claudinite/claudinite-canon-curation/growth-promote/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pinned engine
        run: sh .claudinite/launch version
      - name: Promote writes only under the corpus roots
        run: .claudinite/bin/cn growth promote-scope --base origin/main
