name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Node tests
        run: node --test $(git ls-files '*.test.mjs')

  # The pull-request half of "a version is published once": a pack whose shipped content changed
  # under a version already on `vendored` fails here, before the merge; release-packs' publish job
  # refuses the same thing after it. No secrets, so a fork's pull request runs it too.
  release-plan:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - name: Every changed pack carries a new version
        run: node tools/release/release.mjs plan --content --remote origin
      - name: The pack directory is current with the manifests and the catalog
        run: node tools/directory/render.mjs --check --remote origin
